<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mangoAdminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Badge (Dark Midnight Admin Theme) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Admin Shield Badge in Top Right -->
  <path d="M 43 9 L 55 9 L 55 19 C 55 25, 49 29, 49 29 C 49 29, 43 25, 43 19 Z" fill="url(#shieldGrad)" />
  <path d="M 49 13 L 49 23 M 45 17 L 53 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Mango Body with Admin Glow -->
  <g filter="url(#glow)">
    <!-- Stem -->
    <path d="M 25 16 Q 26 22 28 23" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Leaf -->
    <path d="M 27 12 C 35 9, 38 16, 30 19 C 27 19, 27 14, 27 12 Z" fill="#10b981" />
    <!-- Mango Shape -->
    <path d="M 26 23 C 39 23, 43 36, 36 47 C 28 56, 15 50, 13 39 C 11 28, 18 23, 26 23 Z" fill="url(#mangoAdminGrad)"/>
  </g>
</svg>
